# CamillaDSP optional low-latency crossfeed config.
#
# This preset keeps EQ neutral while adding a gentle speaker-like crossfeed:
# - direct left/right paths remain dominant
# - opposite channels are low-passed, delayed, and attenuated
# - a weak early cue adds a small amount of externalization
#
# Add any personal EQ before the crossfeed mixer if desired.

devices:
  samplerate: 48000
  chunksize: 2048
  stop_on_rate_change: false
  capture:
    type: Alsa
    channels: 2
    device: "hw:UAC2Gadget,0"
    format: S16LE
  playback:
    type: Alsa
    channels: 2
    device: "pipewire"
    format: S16LE

mixers:
  to6_crossfeed:
    channels: { in: 2, out: 6 }
    mapping:
      - dest: 0
        sources: [{ channel: 0, gain: 0.0 }]
      - dest: 1
        sources: [{ channel: 1, gain: 0.0 }]
      - dest: 2
        sources: [{ channel: 1, gain: 0.0 }]
      - dest: 3
        sources: [{ channel: 0, gain: 0.0 }]
      - dest: 4
        sources: [{ channel: 1, gain: 0.0 }]
      - dest: 5
        sources: [{ channel: 0, gain: 0.0 }]

  sum2_crossfeed:
    channels: { in: 6, out: 2 }
    mapping:
      - dest: 0
        sources:
          - { channel: 0, gain: 0.0 }
          - { channel: 2, gain: 0.0 }
          - { channel: 4, gain: 0.0 }
      - dest: 1
        sources:
          - { channel: 1, gain: 0.0 }
          - { channel: 3, gain: 0.0 }
          - { channel: 5, gain: 0.0 }

filters:
  headroom:
    type: Gain
    parameters: { gain: -4.0 }

  cf_direct_tilt:
    type: Biquad
    parameters: { type: Lowshelf, freq: 850, slope: 12.0, gain: -2.2 }

  cf_main_lp:
    type: Biquad
    parameters: { type: Lowpass, freq: 700, q: 0.707 }

  cf_main_gain:
    type: Gain
    parameters: { gain: -6.3 }

  cf_main_delay:
    type: Delay
    parameters: { delay: 0.26, unit: ms }

  cf_early_lp:
    type: Biquad
    parameters: { type: Lowpass, freq: 1800, q: 0.707 }

  cf_early_gain:
    type: Gain
    parameters: { gain: -17.0 }

  cf_early_delay:
    type: Delay
    parameters: { delay: 1.10, unit: ms }

pipeline:
  - type: Filter
    channels: [0]
    names: [headroom]

  - type: Filter
    channels: [1]
    names: [headroom]

  - type: Mixer
    name: to6_crossfeed

  - type: Filter
    channels: [2]
    names: [cf_main_lp, cf_main_gain, cf_main_delay]

  - type: Filter
    channels: [3]
    names: [cf_main_lp, cf_main_gain, cf_main_delay]

  - type: Filter
    channels: [4]
    names: [cf_early_lp, cf_early_gain, cf_early_delay]

  - type: Filter
    channels: [5]
    names: [cf_early_lp, cf_early_gain, cf_early_delay]

  - type: Filter
    channels: [0]
    names: [cf_direct_tilt]

  - type: Filter
    channels: [1]
    names: [cf_direct_tilt]

  - type: Mixer
    name: sum2_crossfeed
