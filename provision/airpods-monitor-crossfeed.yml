# CamillaDSP conservative monitor crossfeed config.
#
# This preset aims to soften hard headphone pans and move the image toward
# +/-30-degree studio monitors while preserving headphone tonality:
# - direct left/right paths are not EQ-shaped
# - only the opposite-ear feed is low-passed, delayed, and attenuated
# - no artificial early reflection is added
#
# The 700 Hz first-order lowpass contributes most of the low-frequency delay,
# so the explicit delay is intentionally tiny.

devices:
  samplerate: 48000
  chunksize: 2048
  target_level: 4096
  adjust_period: 5.0
  enable_rate_adjust: true
  stop_on_rate_change: false
  capture:
    type: Alsa
    channels: 2
    device: "hw:UAC2Gadget,0"
    format: S16LE
  playback:
    type: Alsa
    channels: 2
    device: "pipewire"
    format: S16LE

mixers:
  to4_monitor_crossfeed:
    channels: { in: 2, out: 4 }
    mapping:
      - dest: 0
        sources: [{ channel: 0, gain: 0.0 }]
      - dest: 1
        sources: [{ channel: 1, gain: 0.0 }]
      - dest: 2
        sources: [{ channel: 1, gain: 0.0 }]
      - dest: 3
        sources: [{ channel: 0, gain: 0.0 }]

  sum2_monitor_crossfeed:
    channels: { in: 4, out: 2 }
    mapping:
      - dest: 0
        sources:
          - { channel: 0, gain: 0.0 }
          - { channel: 2, gain: 0.0 }
      - dest: 1
        sources:
          - { channel: 1, gain: 0.0 }
          - { channel: 3, gain: 0.0 }

filters:
  headroom:
    type: Gain
    parameters: { gain: -3.0 }

  cf_shadow_lp:
    type: Biquad
    parameters: { type: LowpassFO, freq: 700 }

  cf_bleed_gain:
    type: Gain
    parameters: { gain: -9.5 }

  cf_geometry_delay:
    type: Delay
    parameters: { delay: 0.05, unit: ms, subsample: true }

pipeline:
  - type: Filter
    channels: [0, 1]
    names: [headroom]

  - type: Mixer
    name: to4_monitor_crossfeed

  - type: Filter
    channels: [2, 3]
    names: [cf_shadow_lp, cf_bleed_gain, cf_geometry_delay]

  - type: Mixer
    name: sum2_monitor_crossfeed
