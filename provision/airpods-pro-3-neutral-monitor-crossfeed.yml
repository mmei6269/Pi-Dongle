# CamillaDSP AirPods Pro 3rd generation neutrality EQ plus conservative monitor crossfeed.
#
# EQ comes first, then the monitor crossfeed. The crossfeed portion leaves the
# direct left/right paths unshaped after EQ and only adds low-passed, lightly
# delayed opposite-ear feed.

devices:
  samplerate: 48000
  chunksize: 2048
  stop_on_rate_change: false
  capture:
    type: Alsa
    channels: 2
    device: "hw:UAC2Gadget,0"
    format: S16LE
  playback:
    type: Alsa
    channels: 2
    device: "pipewire"
    format: S16LE

mixers:
  to4_monitor_crossfeed:
    channels: { in: 2, out: 4 }
    mapping:
      - dest: 0
        sources: [{ channel: 0, gain: 0.0 }]
      - dest: 1
        sources: [{ channel: 1, gain: 0.0 }]
      - dest: 2
        sources: [{ channel: 1, gain: 0.0 }]
      - dest: 3
        sources: [{ channel: 0, gain: 0.0 }]

  sum2_monitor_crossfeed:
    channels: { in: 4, out: 2 }
    mapping:
      - dest: 0
        sources:
          - { channel: 0, gain: 0.0 }
          - { channel: 2, gain: 0.0 }
      - dest: 1
        sources:
          - { channel: 1, gain: 0.0 }
          - { channel: 3, gain: 0.0 }

filters:
  headroom:
    type: Gain
    parameters: { gain: -7.0 }

  ap3_pk_45:
    type: Biquad
    parameters: { type: Peaking, freq: 45, q: 1.414, gain: 1.0 }

  ap3_ls_70:
    type: Biquad
    parameters: { type: Lowshelf, freq: 70, q: 0.707, gain: -7.5 }

  ap3_pk_150:
    type: Biquad
    parameters: { type: Peaking, freq: 150, q: 2.3, gain: 0.8 }

  ap3_pk_300:
    type: Biquad
    parameters: { type: Peaking, freq: 300, q: 0.707, gain: -1.0 }

  ap3_pk_1500:
    type: Biquad
    parameters: { type: Peaking, freq: 1500, q: 2.616, gain: 1.4 }

  ap3_pk_1900:
    type: Biquad
    parameters: { type: Peaking, freq: 1900, q: 1.202, gain: 1.4 }

  ap3_pk_2400:
    type: Biquad
    parameters: { type: Peaking, freq: 2400, q: 1.414, gain: -1.4 }

  ap3_pk_3000:
    type: Biquad
    parameters: { type: Peaking, freq: 3000, q: 0.707, gain: 1.3 }

  ap3_pk_3400:
    type: Biquad
    parameters: { type: Peaking, freq: 3400, q: 1.909, gain: 2.9 }

  ap3_pk_5300:
    type: Biquad
    parameters: { type: Peaking, freq: 5300, q: 2.616, gain: -2.7 }

  ap3_hs_6000:
    type: Biquad
    parameters: { type: Highshelf, freq: 6000, q: 0.707, gain: -5.7 }

  ap3_pk_7700:
    type: Biquad
    parameters: { type: Peaking, freq: 7700, q: 4.949, gain: 5.0 }

  ap3_pk_10000:
    type: Biquad
    parameters: { type: Peaking, freq: 10000, q: 3.535, gain: -5.0 }

  cf_shadow_lp:
    type: Biquad
    parameters: { type: LowpassFO, freq: 700 }

  cf_bleed_gain:
    type: Gain
    parameters: { gain: -9.5 }

  cf_geometry_delay:
    type: Delay
    parameters: { delay: 0.05, unit: ms, subsample: true }

pipeline:
  - type: Filter
    channels: [0]
    names:
      - headroom
      - ap3_pk_45
      - ap3_ls_70
      - ap3_pk_150
      - ap3_pk_300
      - ap3_pk_1500
      - ap3_pk_1900
      - ap3_pk_2400
      - ap3_pk_3000
      - ap3_pk_3400
      - ap3_pk_5300
      - ap3_hs_6000
      - ap3_pk_7700
      - ap3_pk_10000

  - type: Filter
    channels: [1]
    names:
      - headroom
      - ap3_pk_45
      - ap3_ls_70
      - ap3_pk_150
      - ap3_pk_300
      - ap3_pk_1500
      - ap3_pk_1900
      - ap3_pk_2400
      - ap3_pk_3000
      - ap3_pk_3400
      - ap3_pk_5300
      - ap3_hs_6000
      - ap3_pk_7700
      - ap3_pk_10000

  - type: Mixer
    name: to4_monitor_crossfeed

  - type: Filter
    channels: [2, 3]
    names: [cf_shadow_lp, cf_bleed_gain, cf_geometry_delay]

  - type: Mixer
    name: sum2_monitor_crossfeed
