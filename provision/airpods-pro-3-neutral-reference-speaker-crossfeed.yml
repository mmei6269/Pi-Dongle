# CamillaDSP AirPods Pro 3rd generation neutrality EQ plus reference
# virtual-speaker crossfeed.
#
# EQ comes first, then a compensated +/-30-degree speaker-to-ear matrix. The
# reference-speaker FIRs include Brown/Duda spherical-head shadowing,
# Woodworth-style interaural timing, and phantom-center tonal compensation.

devices:
  samplerate: 48000
  chunksize: 2048
  stop_on_rate_change: false
  capture:
    type: Alsa
    channels: 2
    device: "hw:UAC2Gadget,0"
    format: S16LE
  playback:
    type: Alsa
    channels: 2
    device: "pipewire"
    format: S16LE

mixers:
  to4_reference_speaker:
    channels: { in: 2, out: 4 }
    mapping:
      # LL: left speaker -> left ear
      - dest: 0
        sources: [{ channel: 0, gain: 0.0 }]
      # LR: left speaker -> right ear
      - dest: 1
        sources: [{ channel: 0, gain: 0.0 }]
      # RL: right speaker -> left ear
      - dest: 2
        sources: [{ channel: 1, gain: 0.0 }]
      # RR: right speaker -> right ear
      - dest: 3
        sources: [{ channel: 1, gain: 0.0 }]

  sum2_reference_speaker:
    channels: { in: 4, out: 2 }
    mapping:
      - dest: 0
        sources:
          - { channel: 0, gain: 0.0 }
          - { channel: 2, gain: 0.0 }
      - dest: 1
        sources:
          - { channel: 1, gain: 0.0 }
          - { channel: 3, gain: 0.0 }

filters:
  headroom:
    type: Gain
    parameters: { gain: -7.0 }

  ap3_pk_45:
    type: Biquad
    parameters: { type: Peaking, freq: 45, q: 1.414, gain: 1.0 }

  ap3_ls_70:
    type: Biquad
    parameters: { type: Lowshelf, freq: 70, q: 0.707, gain: -7.5 }

  ap3_pk_150:
    type: Biquad
    parameters: { type: Peaking, freq: 150, q: 2.3, gain: 0.8 }

  ap3_pk_300:
    type: Biquad
    parameters: { type: Peaking, freq: 300, q: 0.707, gain: -1.0 }

  ap3_pk_1500:
    type: Biquad
    parameters: { type: Peaking, freq: 1500, q: 2.616, gain: 1.4 }

  ap3_pk_1900:
    type: Biquad
    parameters: { type: Peaking, freq: 1900, q: 1.202, gain: 1.4 }

  ap3_pk_2400:
    type: Biquad
    parameters: { type: Peaking, freq: 2400, q: 1.414, gain: -1.4 }

  ap3_pk_3000:
    type: Biquad
    parameters: { type: Peaking, freq: 3000, q: 0.707, gain: 1.3 }

  ap3_pk_3400:
    type: Biquad
    parameters: { type: Peaking, freq: 3400, q: 1.909, gain: 2.9 }

  ap3_pk_5300:
    type: Biquad
    parameters: { type: Peaking, freq: 5300, q: 2.616, gain: -2.7 }

  ap3_hs_6000:
    type: Biquad
    parameters: { type: Highshelf, freq: 6000, q: 0.707, gain: -5.7 }

  ap3_pk_7700:
    type: Biquad
    parameters: { type: Peaking, freq: 7700, q: 4.949, gain: 5.0 }

  ap3_pk_10000:
    type: Biquad
    parameters: { type: Peaking, freq: 10000, q: 3.535, gain: -5.0 }

  ref_speaker_ipsi:
    type: Conv
    parameters:
      type: File
      filename: /etc/camilladsp/reference-speaker/speaker_30_ipsi_fir.txt
      format: TEXT

  ref_speaker_contra:
    type: Conv
    parameters:
      type: File
      filename: /etc/camilladsp/reference-speaker/speaker_30_contra_fir.txt
      format: TEXT

pipeline:
  - type: Filter
    channels: [0]
    names:
      - headroom
      - ap3_pk_45
      - ap3_ls_70
      - ap3_pk_150
      - ap3_pk_300
      - ap3_pk_1500
      - ap3_pk_1900
      - ap3_pk_2400
      - ap3_pk_3000
      - ap3_pk_3400
      - ap3_pk_5300
      - ap3_hs_6000
      - ap3_pk_7700
      - ap3_pk_10000

  - type: Filter
    channels: [1]
    names:
      - headroom
      - ap3_pk_45
      - ap3_ls_70
      - ap3_pk_150
      - ap3_pk_300
      - ap3_pk_1500
      - ap3_pk_1900
      - ap3_pk_2400
      - ap3_pk_3000
      - ap3_pk_3400
      - ap3_pk_5300
      - ap3_hs_6000
      - ap3_pk_7700
      - ap3_pk_10000

  - type: Mixer
    name: to4_reference_speaker

  - type: Filter
    channels: [0, 3]
    names: [ref_speaker_ipsi]

  - type: Filter
    channels: [1, 2]
    names: [ref_speaker_contra]

  - type: Mixer
    name: sum2_reference_speaker
