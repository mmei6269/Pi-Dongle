# WirePlumber 0.5+ Bluetooth policy for dongle playback.
# Disable seat-monitoring so bluetooth audio stays available in headless SSH-only mode.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}

monitor.bluez.properties = {
  bluez5.roles = [ a2dp_source ]
  bluez5.codecs = [ aac ]
  bluez5.a2dp.aac.bitratemode = 5
}
